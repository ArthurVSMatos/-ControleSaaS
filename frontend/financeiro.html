<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financeiro - ClinicaSaaS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-24 antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-base font-bold text-gray-900">Relatório Financeiro</h1>
        <p class="text-xs text-gray-500">Fechamento de Caixa e Comissões</p>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Filtro de Datas -->
    <form id="filtroForm" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Data Início</label>
          <input type="date" id="dataInicio" required class="w-full h-10 px-3 rounded-lg border border-gray-300 text-xs bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Data Fim</label>
          <input type="date" id="dataFim" required class="w-full h-10 px-3 rounded-lg border border-gray-300 text-xs bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
      </div>
      <button type="submit" class="w-full h-10 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold rounded-lg text-xs transition-all shadow-sm">
        Gerar Relatório
      </button>
    </form>

    <!-- Cards Resumo -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm text-center">
        <p class="text-[10px] font-bold uppercase text-gray-400">Faturamento</p>
        <p id="faturamentoBruto" class="text-xs font-extrabold text-gray-900 mt-1">R$ 0,00</p>
      </div>

      <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm text-center">
        <p class="text-[10px] font-bold uppercase text-amber-500">Comissões</p>
        <p id="totalComissoes" class="text-xs font-extrabold text-amber-600 mt-1">R$ 0,00</p>
      </div>

      <div class="bg-white p-3 rounded-xl border border-emerald-200 bg-emerald-50/50 shadow-sm text-center">
        <p class="text-[10px] font-bold uppercase text-emerald-600">Lucro Líquido</p>
        <p id="lucroLiquido" class="text-xs font-extrabold text-emerald-700 mt-1">R$ 0,00</p>
      </div>
    </div>

    <!-- Detalhamento por Profissional -->
    <section class="space-y-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 px-1">Comissões por Profissional</h2>
      <div id="listaComissoes" class="space-y-2">
        <div class="p-4 bg-white rounded-xl shadow-sm border border-gray-200 text-center text-xs text-gray-400">
          Selecione o período e clique em gerar relatório.
        </div>
      </div>
    </section>

  </main>

 <!-- Navigation Bar Fixo (Mobile) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around z-20">
    <a href="/dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span class="text-[10px] font-medium mt-0.5">HOJE</span>
    </a>
    <a href="/cadastros.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <span class="text-[10px] font-medium mt-0.5">Cadastros</span>
    </a>
    <a href="/financeiro.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] font-medium mt-0.5">Financeiro</span>
    </a>
  </nav>

  <script type="module" src="/src/financeiro.js"></script>
</body>
</html>
