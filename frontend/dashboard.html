<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel HOJE - ClinicaSaaS</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>

<body class="bg-gray-100 min-h-screen text-gray-800 antialiased pb-20">

    <!-- Header Fixo -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-base font-bold text-gray-900">Painel HOJE</h1>
                <p id="dataAtual" class="text-xs text-gray-500 capitalize">Carregando...</p>
            </div>
            <button id="logoutBtn" type="button"
                class="text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-100 transition-colors">
                Sair
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Botão Novo Agendamento -->
        <button id="openModalBtn" type="button"
            class="w-full h-12 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold rounded-xl shadow-sm flex items-center justify-center gap-2 text-sm transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>Novo Agendamento</span>
        </button>

        <!-- Lista de Agendamentos -->
        <section class="space-y-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 px-1">Atendimentos de Hoje</h2>
            <div id="listaAgendamentos" class="space-y-2">
                <!-- Cards renderizados via JS -->
            </div>
        </section>
    </main>

    <!-- Modal Novo Agendamento -->
    <div id="modalAgendamento"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex-col justify-end sm:justify-center sm:items-center p-0 sm:p-4">
        <div
            class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-900 text-base">Novo Agendamento</h3>
                <button id="closeModalBtn" type="button"
                    class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition-colors text-xl font-bold">&times;</button>
            </div>

            <form id="agendamentoForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Cliente</label>
                    <select id="clienteSelect" required
                        class="w-full h-11 px-3 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">A carregar clientes...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Serviço</label>
                    <select id="servicoSelect" required
                        class="w-full h-11 px-3 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">A carregar serviços...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Profissional</label>
                    <select id="profissionalSelect" required
                        class="w-full h-11 px-3 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">A carregar profissionais...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Data e Horário</label>
                    <input type="datetime-local" id="dataHoraInput" required
                        class="w-full h-11 px-3 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
                </div>

                <div id="modalError"
                    class="hidden p-3 text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg text-center font-medium">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancelModalBtn"
                        class="w-1/2 h-11 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm transition-colors">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="w-1/2 h-11 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm transition-colors shadow-sm">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Agendamento -->
    <div id="modalEditar"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex-col justify-end sm:justify-center sm:items-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-900 text-base">Alterar Agendamento</h3>
                <button id="closeEditarModalBtn" type="button"
                    class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition-colors text-xl font-bold">&times;</button>
            </div>

            <form id="editarForm" class="space-y-3">
                <input type="hidden" id="editAgendamentoId" />
                <input type="hidden" id="editClienteId" />
                <input type="hidden" id="editServicoId" />

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nova Data e Horário</label>
                    <input type="datetime-local" id="editDataHoraInput" required
                        class="w-full h-11 px-3 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Profissional</label>
                    <select id="editProfissionalSelect" required
                        class="w-full h-11 px-3 rounded-lg border border-gray-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </select>
                </div>

                <div id="editModalError"
                    class="hidden p-3 text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg text-center font-medium">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancelEditarModalBtn"
                        class="w-1/2 h-11 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm transition-colors">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="w-1/2 h-11 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm transition-colors shadow-sm">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Navigation Bar Fixo (Mobile) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around z-20">
        <a href="/dashboard.html" class="flex flex-col items-center text-emerald-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span class="text-[10px] font-bold mt-0.5">HOJE</span>
        </a>
        <a href="/calendario.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <span class="text-[10px] font-medium mt-0.5">Agenda</span>
        </a>
        <a href="/cadastros.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <span class="text-[10px] font-medium mt-0.5">Cadastros</span>
        </a>
        <a href="/financeiro.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-[10px] font-medium mt-0.5">Financeiro</span>
        </a>
    </nav>

    <script type="module" src="/src/dashboard.js"></script>
</body>

</html>
