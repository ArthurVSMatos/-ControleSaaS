<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinicaSaaS - Login</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-gray-50">

  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand-50 text-brand-600 mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-800">ClinicaSaaS</h1>
      <p class="text-sm text-gray-500">Acesse o seu painel de controle</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail</label>
        <input 
          type="email" 
          id="email" 
          required 
          value="admin@clinica.com"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Senha</label>
        <input 
          type="password" 
          id="senha" 
          required 
          value="123456"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
        />
      </div>

      <div id="errorMessage" class="hidden p-3 text-xs text-red-600 bg-red-50 rounded-lg text-center font-medium"></div>

      <button 
        type="submit" 
        class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all text-sm"
      >
        Entrar no Sistema
      </button>
    </form>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
