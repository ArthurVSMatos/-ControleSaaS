<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastros - ClinicaSaaS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-24 antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-base font-bold text-gray-900">Gestão de Cadastros</h1>
        <p class="text-xs text-gray-500">Clientes, Serviços e Profissionais</p>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Navegação por Abas -->
    <div class="flex bg-gray-200 p-1 rounded-xl gap-1 text-xs font-bold">
      <button id="tabClientes" type="button" class="flex-1 py-2 rounded-lg bg-white text-emerald-700 shadow-sm transition-all">Clientes</button>
      <button id="tabServicos" type="button" class="flex-1 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition-all">Serviços</button>
      <button id="tabProfissionais" type="button" class="flex-1 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition-all">Profissionais</button>
    </div>

    <!-- Botão de Ação Dinâmico -->
    <button id="btnNovo" type="button" class="w-full h-11 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold rounded-xl shadow-sm flex items-center justify-center gap-2 text-sm transition-all">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      <span id="lblBtnNovo">Novo Cliente</span>
    </button>

    <!-- Lista Dinâmica -->
    <div id="containerLista" class="space-y-2">
      <div class="p-4 bg-white rounded-xl shadow-sm border border-gray-200 text-center text-xs text-gray-400">
        A carregar dados...
      </div>
    </div>

  </main>

  <!-- Modal Genérico de Formulário -->
  <div id="modalCadastro" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex-col justify-end sm:justify-center sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h3 id="modalTitulo" class="font-bold text-gray-900 text-base">Cadastrar</h3>
        <button id="closeModalBtn" type="button" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 text-xl font-bold">&times;</button>
      </div>

      <form id="cadastroForm" class="space-y-3">
        <div id="camposForm" class="space-y-3">
          <!-- Injetado dinamicamente via JS -->
        </div>

        <div id="modalError" class="hidden p-3 text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg text-center font-medium"></div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="cancelModalBtn" class="w-1/2 h-11 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm">Cancelar</button>
          <button type="submit" class="w-1/2 h-11 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm shadow-sm">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Navigation Bar Fixo -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around z-20">
    <a href="/dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span class="text-[10px] font-medium mt-0.5">HOJE</span>
    </a>
    <a href="/cadastros.html" class="flex flex-col items-center text-emerald-600 font-bold">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <span class="text-[10px] font-medium mt-0.5">Cadastros</span>
    </a>
    <a href="/financeiro.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] font-medium mt-0.5">Financeiro</span>
    </a>
  </nav>

  <script type="module" src="/src/cadastros.js"></script>
</body>
</html>
